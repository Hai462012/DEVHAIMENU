<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="menu" id="loginBox">
  <h2>ADMIN LOGIN</h2>
  <input id="user" placeholder="Username"><br><br>
  <input id="pass" type="password" placeholder="Password"><br><br>
  <button onclick="login()">Đăng nhập</button>
</div>

<div class="menu" id="adminBox" style="display:none;">
  <h2>QUẢN LÝ KEY</h2>

  <input id="keyName" placeholder="Nhập key"><br><br>
  <input id="days" placeholder="Số ngày"><br><br>
  <input id="maxDevices" placeholder="Số thiết bị"><br><br>

  <button onclick="createKey()">Tạo Key</button>

  <h3>Danh sách key</h3>
  <ul id="list"></ul>
</div>

<script src="admin.js"></script>
</body>
</html>
